[project]
name = "crypto-chatbot-rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "gradio>=6.22.0",
    "langchain>=1.3.14",
    "langchain-openai>=1.4.1",
    "langchain-text-splitters>=1.1.2",
    "lxml>=5,<7",
    "openai>=2.53.0",
    "pandas>=2.0,<3",
    "pyarrow>=15,<22",
    "python-dotenv>=1.2.2",
    "python-path>=0.1.3",
    "qdrant-client>=1.18.0",
    "requests>=2.31,<3",
    "tiktoken>=0.13.0",
]

[tool.uv]
link-mode = "copy"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/RAG_model"]
