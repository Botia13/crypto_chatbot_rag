[project]
name = "crypto-chatbot-rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "fastembed",
    "gradio",
    "openai",
    "pydantic-settings",
    "python-dotenv",
    "qdrant-client",
    "tenacity",
]

[tool.uv]
link-mode = "copy"

[tool.pytest.ini_options]
testpaths = ["tests"]
tmp_path_retention_policy = "none"

[dependency-groups]
dev = [
    "ipykernel>=6",
    "jupyter-client>=8",
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
]

evaluation = [
    "ipywidgets",
    "nbformat",
    "pandas",
    "plotly",
    "pyarrow",
    "ragas",
    "seaborn",
    "sentence-transformers",
]

ingestion = [
    "beautifulsoup4",
    "langchain-text-splitters",
    "lxml",
    "pandas",
    "pyarrow",
    "requests",
    "tiktoken",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/RAG_model"]
