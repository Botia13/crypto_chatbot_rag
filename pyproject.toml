[project]
name = "crypto-chatbot-rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "fastapi[standard]>=0.141.1",
    "fastembed>=0.8.0",
    "gradio>=6.22.0",
    "ipywidgets>=8.1.9",
    "langchain>=1.3.14",
    "langchain-community<0.4",
    "langchain-openai>=1.4.1",
    "langchain-text-splitters>=1.1.2",
    "lxml>=5,<7",
    "nbformat>=5.11.1",
    "openai>=2.53.0",
    "pandas>=2.0,<3",
    "plotly>=6.9.0",
    "pyarrow>=15,<22",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "python-path>=0.1.3",
    "qdrant-client>=1.18.0",
    "ragas>=0.4.3",
    "requests>=2.31,<3",
    "seaborn>=0.13.2",
    "sentence-transformers>=6.0.0",
    "tenacity>=9.1.4",
    "tiktoken>=0.13.0",
]

[tool.uv]
link-mode = "copy"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/RAG_model"]
